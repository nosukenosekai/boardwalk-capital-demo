<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>民泊クエスト 〜180日の壁を越えろ〜</title>
<style>
  :root{
    --bg:#0a1424; --bg2:#0e1c33; --panel:#12233f; --panel2:#16294a;
    --line:#2a4a72; --edge:#2f5b8f; --cyan:#4fd0e0; --cyan-d:#2b8ea0;
    --green:#8fe6b0; --green-d:#57c98a; --ink:#eaf2ff; --muted:#9fb4d4;
    --gold:#ffcf6b; --danger:#ff6b6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#050b16;color:#eaf2ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    overscroll-behavior:none; user-select:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%, #0e2138 0%, #081324 55%, #050b16 100%);padding:10px}
  .stage{position:relative;width:100%;max-width:1000px;aspect-ratio:16/10;
    background:var(--bg);border:2px solid var(--edge);border-radius:16px;
    box-shadow:0 0 0 1px #0a1a30, 0 20px 60px rgba(0,0,0,.6), inset 0 0 60px rgba(0,20,40,.4);
    overflow:hidden}
  @media (max-height:640px){.stage{aspect-ratio:auto;height:100%}}
  @media (max-aspect-ratio:1/1){.stage{aspect-ratio:auto;height:100%;max-width:640px}}
  .hidden{display:none !important}

  /* ---------- Title ---------- */
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding:3% 6%;gap:2.2%;overflow:auto}
  .ver{align-self:flex-start;color:#6d86ab;font-size:.72rem;letter-spacing:.14em;font-weight:700}
  .banner{position:relative;width:100%;max-width:640px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
    border:2px solid #244266;background:
      linear-gradient(180deg,#7ec4ff 0%,#a9dcff 42%,#bfe6b0 60%,#8fd07a 100%);
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .banner .subver{position:absolute;top:8px;left:10px;font-size:.6rem;color:#12345a;font-weight:800;letter-spacing:.12em;z-index:3}
  .banner .clouds{position:absolute;inset:0;opacity:.9}
  .banner .cloud{position:absolute;background:#fff;border-radius:50%;filter:blur(1px);opacity:.85}
  .banner .mountains{position:absolute;left:0;right:0;bottom:36%;height:26%;
    background:linear-gradient(180deg,#5a8f5f,#3f7346);clip-path:polygon(0 100%,8% 40%,18% 70%,30% 20%,44% 60%,58% 25%,72% 65%,86% 30%,100% 70%,100% 100%)}
  .banner .ground{position:absolute;left:0;right:0;bottom:0;height:40%;
    background:linear-gradient(180deg,#8fd07a,#5fae55)}
  .banner .river{position:absolute;bottom:0;left:46%;width:8%;height:64%;
    background:linear-gradient(180deg,#8fd0ff,#3f8fd0);transform:skewX(-6deg);border-radius:40%}
  .logo{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);z-index:4;text-align:center;padding:0 4%}
  .logo h1{margin:0;font-size:clamp(1.3rem,5.4vw,2.5rem);font-weight:900;letter-spacing:.02em;
    color:#ffdf85;-webkit-text-stroke:1.5px #6b4a12;white-space:nowrap;
    text-shadow:0 3px 0 #915f14, 0 5px 8px rgba(0,0,0,.4);line-height:1}
  .logo .home{filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));font-size:.9em}
  .logo p{margin:.3em 0 0;font-size:clamp(.62rem,2.3vw,1rem);font-weight:800;color:#123018;
    text-shadow:0 1px 0 rgba(255,255,255,.45);white-space:nowrap}
  .tagline{color:#cfe0ff;font-size:clamp(.8rem,2.4vw,1.05rem);font-weight:600;margin:.2em 0 0}
  .nowplaying{color:var(--cyan);font-size:.8rem;font-weight:600}
  .menu{width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px;margin-top:.4rem}
  .btn{appearance:none;border:2px solid #2c4a72;border-radius:12px;padding:14px 18px;font-size:clamp(.95rem,2.6vw,1.15rem);
    font-weight:800;cursor:pointer;transition:transform .06s, filter .15s, box-shadow .15s;text-align:center;color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,#a9edc4,#7ad3a0);color:#123a24;border-color:#57c98a;
    box-shadow:0 6px 0 #3f9d6f, 0 8px 16px rgba(0,0,0,.35)}
  .btn.primary:active{box-shadow:0 3px 0 #3f9d6f, 0 4px 10px rgba(0,0,0,.35)}
  .btn.ghost{background:linear-gradient(180deg,#20365a,#182a48);border-color:#33507d;
    box-shadow:0 5px 0 #0e1f38, 0 6px 12px rgba(0,0,0,.3)}
  .btn.ghost:active{box-shadow:0 2px 0 #0e1f38}
  .btn.ghost:disabled{opacity:.45;cursor:default;box-shadow:none}
  .divider{width:100%;max-width:640px;height:1px;background:#25406b;margin:2px 0}
  .footnote{color:#5f79a0;font-size:.72rem;text-align:center;margin-top:auto;padding-top:8px}

  /* ---------- Game ---------- */
  #game{position:absolute;inset:0;display:flex;flex-direction:column}
  .worldwrap{position:relative;flex:1;min-height:0;margin:10px 10px 0;border:2px solid #234a72;border-radius:12px;
    overflow:hidden;background:#0c1a2e;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
  canvas#world{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
  .missionbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:8px 12px;font-weight:800;letter-spacing:.08em;color:#cfe0ff;z-index:5;pointer-events:none;
    background:linear-gradient(180deg,rgba(4,10,22,.85),rgba(4,10,22,0));text-shadow:0 1px 2px #000}
  .missionbar .m{font-size:clamp(.7rem,2.2vw,.95rem)}
  .missionbar .loc{font-size:clamp(.7rem,2.2vw,.95rem);color:#eaf2ff}
  .objective{position:absolute;top:34px;left:10px;right:10px;z-index:5;pointer-events:none;
    border:2px solid var(--gold);border-radius:10px;background:rgba(6,14,28,.82);
    padding:8px 12px;color:#ffe9b0;font-weight:800;font-size:clamp(.72rem,2.2vw,.95rem);
    display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .objective .dia{color:var(--gold)}
  .hint{position:absolute;top:74px;left:14px;z-index:5;pointer-events:none;
    background:rgba(6,14,28,.7);border:1px solid #33507d;border-radius:8px;padding:3px 9px;
    font-size:.72rem;color:#bcd0f0;font-weight:700}
  .hud{position:absolute;top:8px;right:12px;z-index:6;display:flex;gap:8px;pointer-events:none}
  .chip{background:rgba(6,14,28,.8);border:1px solid #33507d;border-radius:8px;padding:3px 9px;
    font-size:.74rem;font-weight:800;color:#eaf2ff}
  .chip .k{color:var(--muted);margin-right:4px}

  /* dialogue */
  .dialogue{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:10px;
    background:linear-gradient(0deg,rgba(3,8,18,.96),rgba(3,8,18,.72));cursor:pointer}
  .dbox{border:2px solid #3a5c8c;border-radius:12px;background:rgba(8,16,30,.96);padding:12px 16px;min-height:78px;
    box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .dname{color:var(--cyan);font-weight:900;font-size:.92rem;margin-bottom:4px;letter-spacing:.04em}
  .dtext{color:#eef4ff;font-size:clamp(.85rem,2.6vw,1.02rem);line-height:1.5;min-height:1.4em;white-space:pre-wrap}
  .dnext{text-align:right;color:#7f97bd;font-size:.7rem;margin-top:6px;font-weight:700}

  /* choices */
  .choices{position:absolute;left:0;right:0;bottom:0;z-index:9;padding:10px;display:flex;flex-direction:column;gap:8px}
  .choices .btn{padding:11px 16px}

  /* bottom controls */
  .controls{display:flex;align-items:stretch;gap:10px;padding:10px}
  .dpad{position:relative;width:118px;flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);gap:5px}
  .dbtn{background:linear-gradient(180deg,#22528e,#173a66);border:2px solid #3f6ea8;border-radius:10px;
    color:#dbe9ff;font-size:1.1rem;font-weight:900;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 0 #0e2445;aspect-ratio:1}
  .dbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #0e2445}
  .dbtn.up{grid-column:2;grid-row:1}
  .dbtn.left{grid-column:1;grid-row:2}
  .dbtn.right{grid-column:3;grid-row:2}
  .dbtn.down{grid-column:2;grid-row:3}
  .actionbar{flex:1;display:grid;grid-template-rows:1fr 1fr;gap:8px;min-width:0}
  .talk{background:linear-gradient(180deg,#a9edc4,#79d0a0);color:#123a24;border:2px solid #57c98a;
    border-radius:12px;font-size:clamp(1rem,3vw,1.3rem);font-weight:900;letter-spacing:.14em;cursor:pointer;
    box-shadow:0 5px 0 #3f9d6f;display:flex;align-items:center;justify-content:center}
  .talk:active{transform:translateY(2px);box-shadow:0 3px 0 #3f9d6f}
  .subbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sbtn{background:linear-gradient(180deg,#20365a,#182a48);border:2px solid #33507d;border-radius:10px;
    color:#dbe9ff;font-weight:800;font-size:clamp(.8rem,2.4vw,1rem);cursor:pointer;padding:9px 6px;
    display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 4px 0 #0e1f38}
  .sbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #0e1f38}

  /* modal */
  .modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(3,8,18,.66);backdrop-filter:blur(2px);padding:16px}
  .card{width:100%;max-width:420px;background:linear-gradient(180deg,#132a4a,#0f1f39);border:2px solid #34568a;border-radius:16px;
    padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .card h2{margin:0 0 18px;font-size:1.4rem;font-weight:900;color:#eef4ff}
  .field{margin-bottom:14px}
  .field label{display:block;color:var(--muted);font-size:.82rem;font-weight:700;margin-bottom:6px}
  .field input,.field select{width:100%;padding:12px 14px;border-radius:10px;border:2px solid #35558a;
    background:#0b1830;color:#eef4ff;font-size:1rem;font-weight:600;font-family:inherit}
  .field input:focus,.field select:focus{outline:none;border-color:var(--cyan)}
  .questlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
  .questlist li{border:1px solid #2c4a76;border-radius:10px;padding:10px 12px;background:#0d1c33;
    font-size:.9rem;line-height:1.4}
  .questlist li.done{opacity:.55}
  .questlist li .tag{font-weight:900;font-size:.72rem;padding:1px 7px;border-radius:6px;margin-right:8px}
  .tag.now{background:var(--gold);color:#3a2a00}
  .tag.ok{background:var(--green-d);color:#04220f}
  .tag.next{background:#2c4a76;color:#bcd0f0}

  /* toast */
  .toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:30;
    background:rgba(8,18,34,.96);border:2px solid var(--gold);border-radius:12px;padding:10px 18px;
    color:#ffe9b0;font-weight:800;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;transition:opacity .3s, transform .3s;pointer-events:none;text-align:center;max-width:80%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="stage">

    <!-- ============ TITLE ============ -->
    <section id="title">
      <div class="ver">VERSION 7.0.7</div>
      <div class="banner">
        <div class="subver">VERSION 2.6</div>
        <div class="clouds">
          <span class="cloud" style="left:12%;top:12%;width:60px;height:22px"></span>
          <span class="cloud" style="left:64%;top:8%;width:80px;height:26px"></span>
          <span class="cloud" style="left:40%;top:20%;width:46px;height:18px"></span>
        </div>
        <div class="mountains"></div>
        <div class="ground"></div>
        <div class="river"></div>
        <div class="logo">
          <h1>民泊<span class="home">🏠</span>クエスト</h1>
          <p>〜180日の壁を越えろ〜</p>
        </div>
      </div>
      <div class="tagline">一軒の宿が、町の未来を変える。</div>
      <div class="nowplaying">♪ 英雄の門出</div>
      <div class="menu">
        <button class="btn primary" id="btnNew">▶ はじめから</button>
        <button class="btn ghost" id="btnContinue">▶ つづきから</button>
        <div class="divider"></div>
        <button class="btn primary" id="btnMusic">🎵 音楽を有効にする</button>
        <button class="btn ghost" id="btnSoundHelp">音が出ないとき</button>
      </div>
      <div class="footnote">2.5｜文字表示安定化・シネマティックオープニング</div>
    </section>

    <!-- ============ GAME ============ -->
    <section id="game" class="hidden">
      <div class="worldwrap">
        <canvas id="world"></canvas>
        <div class="missionbar">
          <span class="m" id="missionText">MISSION: 村長の依頼を聞く</span>
          <span class="loc" id="locText">ユリイカ村</span>
        </div>
        <div class="objective"><span class="dia">◆</span><span id="objText">次は「村長」に話しかけよう</span></div>
        <div class="hint" id="hintText">↓／あと約6マス</div>
        <div class="hud">
          <span class="chip"><span class="k">資金</span><span id="hudMoney">30万</span></span>
          <span class="chip"><span class="k">Day</span><span id="hudDay">1</span></span>
        </div>

        <div class="dialogue hidden" id="dialogue">
          <div class="dbox">
            <div class="dname" id="dName">村長</div>
            <div class="dtext" id="dText"></div>
            <div class="dnext">TALK / タップで進む ▶</div>
          </div>
        </div>
        <div class="choices hidden" id="choices"></div>
      </div>

      <div class="controls">
        <div class="dpad">
          <button class="dbtn up" data-dir="up">▲</button>
          <button class="dbtn left" data-dir="left">◀</button>
          <button class="dbtn right" data-dir="right">▶</button>
          <button class="dbtn down" data-dir="down">▼</button>
        </div>
        <div class="actionbar">
          <button class="talk" id="btnTalk">TALK</button>
          <div class="subbar">
            <button class="sbtn" id="btnQuest">QUEST</button>
            <button class="sbtn" id="btnSave">SAVE</button>
            <button class="sbtn" id="btnBgm">♪ BGM</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CREATE MODAL ============ -->
    <div class="modal hidden" id="createModal">
      <div class="card">
        <h2>主人公を決める</h2>
        <div class="field">
          <label>名前</label>
          <input id="inpName" type="text" maxlength="8" value="リュウ" autocomplete="off">
        </div>
        <div class="field">
          <label>職業</label>
          <select id="inpJob">
            <option value="サラリーマン">サラリーマン</option>
            <option value="脱サラ職人">脱サラ職人</option>
            <option value="元ホテルマン">元ホテルマン</option>
            <option value="主婦">主婦</option>
            <option value="地元Uターン">地元Uターン</option>
          </select>
        </div>
        <button class="btn primary" id="btnToVillage">ユリイカ村へ</button>
      </div>
    </div>

    <!-- ============ QUEST MODAL ============ -->
    <div class="modal hidden" id="questModal">
      <div class="card">
        <h2>クエスト</h2>
        <ul class="questlist" id="questList"></ul>
        <div style="height:12px"></div>
        <button class="btn ghost" id="btnQuestClose">とじる</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
"use strict";
(function(){
/* =========================================================================
   民泊クエスト 〜180日の壁を越えろ〜   自作プロトタイプ
   - 見下ろし型: グリッド移動 / 会話 / クエスト / セーブ(localStorage) / BGM
   ========================================================================= */

// ---------- DOM ----------
const $ = s => document.querySelector(s);
const titleEl=$('#title'), gameEl=$('#game');
const canvas=$('#world'), ctx=canvas.getContext('2d');
const dialogueEl=$('#dialogue'), dNameEl=$('#dName'), dTextEl=$('#dText');
const choicesEl=$('#choices');
const missionTextEl=$('#missionText'), objTextEl=$('#objText'), hintEl=$('#hintText');
const locTextEl=$('#locText'), hudMoney=$('#hudMoney'), hudDay=$('#hudDay');
const toastEl=$('#toast');

// ---------- Constants ----------
const TILE=32, MAPW=22, MAPH=15;
const SAVE_KEY='hermes_save_v1';
// tile types
const G=0,P=1,W=2,T=3,B=4; // grass, path, water, tree, building(blocked)

// Village map (22 x 15). Buildings drawn separately; here just walkability base.
// Legend: .=grass  #=path  ~=water  T=tree  (buildings overlaid via BUILDINGS)
const MAPSTR=[
 "TTTTTTTTTTTTTTTTTTTTTT",
 "T..............#.....T",
 "T..BBB...BBB...#..BBB.T".replace(/B/g,'.'),
 "T....#....#....#...#..T",
 "T....#....#....#...#..T",
 "T..#############......T",
 "T..#....#.....#.......T",
 "T..#.O..#..F..#...O...T",
 "T..#####@#####........T",
 "T....#..#..#..#..BBB..T".replace(/B/g,'.'),
 "T....#..#..#..#.......T",
 "T~~..############....~T",
 "T~~..#.......#.......~T",
 "T~~..............~~~~~T",
 "TTTTTTTTTTTTTTTTTTTTTT",
];
function charToTile(c){ if(c==='T')return T; if(c==='~')return W; if(c==='#')return P; return G; }
const MAP=[];
for(let y=0;y<MAPH;y++){ const row=[]; for(let x=0;x<MAPW;x++){ row.push(charToTile((MAPSTR[y]||'')[x]||'.')); } MAP.push(row); }

// Buildings: rect in tiles {x,y,w,h}, label, color, entrance tile (tile you stand ON to interact = one tile below door), id
const BUILDINGS=[
  {id:'akiya',  label:'空き家相談所', x:3,  y:1, w:3, h:2, roof:'#6a86c8', wall:'#d9c9a6', ent:{x:4,y:3}},
  {id:'bank',   label:'銀行',        x:9,  y:1, w:3, h:2, roof:'#c8a15a', wall:'#e6dcc0', ent:{x:10,y:3}},
  {id:'fire',   label:'消防署',      x:17, y:1, w:3, h:2, roof:'#b45a4a', wall:'#d9c9a6', ent:{x:18,y:3}},
  {id:'bar',    label:'酒場',        x:3,  y:6, w:3, h:2, roof:'#a85a3a', wall:'#c9a06a', ent:{x:4,y:8}},
  {id:'guild',  label:'民泊ギルド',  x:15, y:6, w:4, h:2, roof:'#3f6fb0', wall:'#c7d4e6', ent:{x:16,y:8}},
  {id:'health', label:'保健所',      x:19, y:9, w:2, h:2, roof:'#4a9a6a', wall:'#cfe0cf', ent:{x:19,y:11}},
  {id:'chief',  label:'村長の家',    x:9,  y:11,w:4, h:2, roof:'#3a5a8a', wall:'#b8c6dc', ent:{x:10,y:10}, npc:'村長'},
];
// mark building footprints as blocked
for(const b of BUILDINGS){ for(let yy=b.y; yy<b.y+b.h; yy++) for(let xx=b.x; xx<b.x+b.w; xx++){ if(MAP[yy]&&MAP[yy][xx]!==undefined) MAP[yy][xx]=B; } }

// Extra NPCs standing on the map (flavor + interactable)
const NPCS=[
  {id:'guildmaster', name:'ギルド長', x:16, y:9, color:'#f0c674', talk:['ようこそ、民泊ギルドへ。','君も"180日の壁"に挑むのかい?']},
  {id:'villager1', name:'村人', x:6, y:9, color:'#8fd0a0', talk:['昔はもっと旅人が来たんだ…','空き家ばかり増えちまってなあ。']},
  {id:'villager2', name:'村人', x:13, y:7, color:'#c08fd0', talk:['宿があれば、この村もまた賑わうかも。']},
];

// ---------- Game state ----------
let state={ scene:'title' };
let game=null; // player+progress once started
let audioOn=false, audioCtx=null, bgmTimer=null;

function defaultGame(){
  return {
    name:'リュウ', job:'サラリーマン',
    px:10, py:6, dir:'down',       // player tile + facing
    money:30, day:1,               // money in 万円
    step:0,                        // main quest step index
    flags:{},
  };
}

// Main quest chain
const QUESTS=[
  {key:'talkChief', title:'村長の依頼を聞く',      obj:'次は「村長」に話しかけよう', target:'chief'},
  {key:'findHouse', title:'空き家相談所で物件を探す', obj:'「空き家相談所」で物件を探そう', target:'akiya'},
  {key:'register',  title:'民泊ギルドで開業登録',    obj:'「民泊ギルド」で開業登録しよう', target:'guild'},
  {key:'permit',    title:'保健所で許可を取る',      obj:'「保健所」で営業許可を取ろう', target:'health'},
  {key:'open',      title:'宿を開業する',            obj:'村長に開業を報告しよう', target:'chief'},
  {key:'done',      title:'あかね荘、開業!',         obj:'ここから先は…続きの開発中!', target:null},
];

// ---------- Rendering ----------
function resizeCanvas(){
  const wrap=canvas.parentElement, r=wrap.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
  render();
}
window.addEventListener('resize', resizeCanvas);

function tileColor(t){
  switch(t){ case W:return '#2f6fae'; case P:return '#c9b487'; case T:return '#274a2c'; default:return '#4f9a4a'; }
}
// camera: fit whole map into canvas
function viewMetrics(){
  const cw=canvas.width, ch=canvas.height;
  const scale=Math.min(cw/(MAPW*TILE), ch/(MAPH*TILE));
  const w=MAPW*TILE*scale, h=MAPH*TILE*scale;
  const ox=(cw-w)/2, oy=(ch-h)/2;
  return {scale, ox, oy};
}
function render(){
  if(state.scene!=='world' && state.scene!=='dialogue' && state.scene!=='choice') return;
  const {scale,ox,oy}=viewMetrics();
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.translate(ox,oy); ctx.scale(scale,scale);

  // ground tiles
  for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){
    const t=MAP[y][x];
    ctx.fillStyle = t===B ? '#3c7a3c' : tileColor(t);
    ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
    if(t===G || t===B){ // grass texture speckle
      ctx.fillStyle='rgba(0,0,0,.06)';
      ctx.fillRect(x*TILE+ (x*7%TILE), y*TILE+(y*11%TILE),2,2);
    }
    if(t===P){ ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.strokeRect(x*TILE+.5,y*TILE+.5,TILE-1,TILE-1); }
    if(t===W){ ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(x*TILE+4,y*TILE+6,TILE-8,2); }
    if(t===T){ drawTree(x*TILE,y*TILE); }
  }
  // buildings
  for(const b of BUILDINGS) drawBuilding(b);
  // npcs
  for(const n of NPCS) drawChar(n.x*TILE, n.y*TILE, n.color, 'down', false);
  // player
  if(game) drawChar(game.px*TILE, game.py*TILE, '#ffd27a', game.dir, true);

  ctx.restore();
}
function drawTree(x,y){
  ctx.fillStyle='#274a2c'; ctx.fillRect(x,y,TILE,TILE);
  ctx.fillStyle='#3f7a3f'; ctx.beginPath(); ctx.arc(x+TILE/2,y+TILE/2-2,TILE/2-3,0,7); ctx.fill();
  ctx.fillStyle='#2f5f2f'; ctx.beginPath(); ctx.arc(x+TILE/2-4,y+TILE/2+2,TILE/2-7,0,7); ctx.fill();
  ctx.fillStyle='#5a3a1a'; ctx.fillRect(x+TILE/2-2,y+TILE-8,4,7);
}
function drawBuilding(b){
  const x=b.x*TILE, y=b.y*TILE, w=b.w*TILE, h=b.h*TILE;
  // wall
  ctx.fillStyle=b.wall; ctx.fillRect(x+2, y+h*0.42, w-4, h*0.58-2);
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.strokeRect(x+2.5, y+h*0.42+.5, w-5, h*0.58-3);
  // roof
  ctx.fillStyle=b.roof; ctx.beginPath();
  ctx.moveTo(x, y+h*0.46); ctx.lineTo(x+w/2, y+2); ctx.lineTo(x+w, y+h*0.46); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(x, y+h*0.44, w, 3);
  // door
  const dw=Math.min(14,w*0.28);
  ctx.fillStyle='#5a3a22'; ctx.fillRect(x+w/2-dw/2, y+h-Math.min(16,h*0.34), dw, Math.min(16,h*0.34)-1);
  // windows
  ctx.fillStyle='#ffe9a8';
  ctx.fillRect(x+6, y+h*0.55, 6,6); ctx.fillRect(x+w-12, y+h*0.55, 6,6);
  // label plate
  const label=b.label; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const tw=ctx.measureText(label).width+12, lx=x+w/2, ly=y-4;
  ctx.fillStyle='rgba(8,16,30,.9)';
  roundRect(lx-tw/2, ly-9, tw, 16, 5); ctx.fill();
  ctx.strokeStyle='#3a5c8c'; ctx.lineWidth=1; roundRect(lx-tw/2, ly-9, tw, 16, 5); ctx.stroke();
  ctx.fillStyle='#eef4ff'; ctx.fillText(label, lx, ly);
  // NEXT marker if this building is the current target
  const q=QUESTS[game?game.step:0];
  if(game && q && q.target===b.id){
    ctx.fillStyle='#ffd24a'; ctx.font='bold 10px sans-serif';
    ctx.fillText('▼NEXT', x+w/2, y+h+7);
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawChar(x,y,color,dir,isPlayer){
  const cx=x+TILE/2, cy=y+TILE/2;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx, y+TILE-4, 8,3,0,0,7); ctx.fill();
  // body
  ctx.fillStyle=color; roundRect(cx-7, cy-2, 14, 14, 4); ctx.fill();
  // head
  ctx.fillStyle='#ffe0b8'; ctx.beginPath(); ctx.arc(cx, cy-6, 6, 0, 7); ctx.fill();
  // hair
  ctx.fillStyle= isPlayer ? '#3a2a18' : '#2a2a2a';
  ctx.beginPath(); ctx.arc(cx, cy-8, 6, Math.PI*1.05, Math.PI*1.95); ctx.fill();
  // eyes (direction)
  ctx.fillStyle='#22303f';
  let ex=0; if(dir==='left')ex=-2; if(dir==='right')ex=2;
  if(dir!=='up'){ ctx.fillRect(cx-3+ex,cy-7,1.6,2); ctx.fillRect(cx+1.4+ex,cy-7,1.6,2); }
  // player outline
  if(isPlayer){ ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; roundRect(cx-7, cy-2, 14, 14, 4); ctx.stroke(); }
}

// ---------- Movement ----------
function walkable(x,y){
  if(x<0||y<0||x>=MAPW||y>=MAPH) return false;
  const t=MAP[y][x];
  if(t===T||t===W||t===B) return false;
  // block NPC tiles
  for(const n of NPCS){ if(n.x===x&&n.y===y) return false; }
  return true;
}
function move(dir){
  if(state.scene!=='world' || !game) return;
  game.dir=dir;
  let nx=game.px, ny=game.py;
  if(dir==='up')ny--; if(dir==='down')ny++; if(dir==='left')nx--; if(dir==='right')nx++;
  if(walkable(nx,ny)){ game.px=nx; game.py=ny; }
  updateHint(); render();
}
function facingTile(){
  let x=game.px,y=game.py;
  if(game.dir==='up')y--; if(game.dir==='down')y++; if(game.dir==='left')x--; if(game.dir==='right')x++;
  return {x,y};
}

// ---------- Interaction ----------
function interact(){
  if(state.scene==='dialogue'){ advanceDialogue(); return; }
  if(state.scene!=='world' || !game) return;
  const f=facingTile();
  // NPC in front?
  const npc=NPCS.find(n=>n.x===f.x&&n.y===f.y);
  if(npc){ talkNPC(npc); return; }
  // Building whose footprint contains the facing tile, OR whose entrance == player tile
  let b=BUILDINGS.find(bb=>f.x>=bb.x&&f.x<bb.x+bb.w&&f.y>=bb.y&&f.y<bb.y+bb.h);
  if(!b){ b=BUILDINGS.find(bb=>bb.ent.x===game.px&&bb.ent.y===game.py); }
  if(b){ enterBuilding(b); return; }
  toast('だれもいない…');
}
function talkNPC(npc){ startDialogue(npc.name, npc.talk.slice()); }

// ---------- Quest logic per building ----------
function enterBuilding(b){
  const step=game.step;
  const q=QUESTS[step];
  // Chief
  if(b.id==='chief'){
    if(step===0){
      startDialogue('村長', [
        game.name+'、この村には泊まる場所がない。',
        '昔は旅人で賑わったユリイカ村も、今は空き家だらけじゃ。',
        'そこでじゃ '+game.name+'。お前さんに"民泊"を開いてほしい。',
        'だが法律の壁がある――年に180日しか泊められん「180日の壁」じゃ。',
        'それでも、一軒の宿が町の未来を変えるかもしれん。頼めるか?',
      ], ()=>{ advanceQuest('talkChief'); toast('クエスト受注: 物件を探そう'); });
      return;
    }
    if(step===4){ // report opening
      startDialogue('村長', [
        'おお '+game.name+'! 許可も揃ったか。',
        'いよいよ「あかね荘」開業じゃな。',
        'よくやった。これがユリイカ村再生の第一歩じゃ!',
      ], ()=>{ advanceQuest('open'); openingCelebrate(); });
      return;
    }
    startDialogue('村長', ['まずは今のクエストを進めるのじゃ。','◆ '+QUESTS[game.step].obj]);
    return;
  }
  // Akiya soudanjo
  if(b.id==='akiya'){
    if(step===1){
      startChoice('空き家相談所', 'どの物件を再生する?', [
        {label:'あかね荘（駅近・和室3）', pick:()=>{ game.flags.house='あかね荘';
          startDialogue('相談員',['「あかね荘」ですね。鍵はこちらです。','次は民泊ギルドで開業登録を!'],()=>{ advanceQuest('findHouse'); toast('物件GET: あかね荘'); }); }},
        {label:'みどり館（山側・広縁あり）', pick:()=>{ game.flags.house='みどり館';
          startDialogue('相談員',['「みどり館」ですね。鍵はこちらです。','次は民泊ギルドで開業登録を!'],()=>{ advanceQuest('findHouse'); toast('物件GET: みどり館'); }); }},
      ]);
      return;
    }
    startDialogue('相談員',['空き家のご相談、いつでもどうぞ。']);
    return;
  }
  // Guild
  if(b.id==='guild'){
    if(step===2){
      startDialogue('ギルド長', [
        'ようこそ、民泊ギルドへ。'+(game.flags.house||'あなたの宿')+'の登録だね。',
        '住宅宿泊事業法――いわゆる民泊新法の届出を受け付けるよ。',
        'そして忘れるな。営業できるのは「年間180日」まで。',
        'この壁をどう越えるかが、経営者の腕の見せどころさ。',
        '登録完了! 次は保健所で許可をもらっておいで。',
      ], ()=>{ advanceQuest('register'); toast('開業登録 完了'); });
      return;
    }
    startDialogue('ギルド長',['180日の壁、越える覚悟はできてるかい?']);
    return;
  }
  // Health center
  if(b.id==='health'){
    if(step===3){
      startDialogue('保健所職員', [
        '衛生基準の確認に来ましたよ。',
        'キッチン、寝具、換気――うん、問題なし。',
        '営業許可を発行します。あとは村長に開業報告を!',
      ], ()=>{ advanceQuest('permit'); toast('営業許可 取得'); });
      return;
    }
    startDialogue('保健所職員',['衛生管理はしっかりね。']);
    return;
  }
  // Bank / fire / bar flavor
  if(b.id==='bank'){ startDialogue('銀行員',['開業資金の融資、ご相談ください。','（※資金システムは開発中）']); return; }
  if(b.id==='fire'){ startDialogue('消防士',['宿泊施設は消防設備の点検が必須だぞ。']); return; }
  if(b.id==='bar'){ startDialogue('マスター',['一杯どうだい? 村の噂話が集まる店さ。']); return; }
  startDialogue(b.label,['……(誰もいないようだ)']);
}

function advanceQuest(expectKey){
  const cur=QUESTS[game.step];
  if(cur && cur.key===expectKey){ game.step++; syncQuestUI(); saveGame(true); }
}
function openingCelebrate(){
  game.step; // already advanced to 'done'
  syncQuestUI();
  toast('🎉 あかね荘、開業おめでとう!');
  setTimeout(()=>startDialogue('ナレーション',[
    'こうして、ユリイカ村に小さな灯りがひとつ点った。',
    '180日の壁、経営、口コミ、リピーター――物語はここから始まる。',
    '（プロトタイプはここまで。続きは開発中!）',
  ]),300);
}

// ---------- Dialogue engine ----------
let dq=[], dqCb=null, typing=false, typeTimer=null, fullLine='';
function startDialogue(name, lines, cb){
  state.scene='dialogue'; dq=lines.slice(); dqCb=cb||null;
  dNameEl.textContent=name;
  dialogueEl.classList.remove('hidden'); choicesEl.classList.add('hidden');
  nextLine();
}
function nextLine(){
  if(dq.length===0){ endDialogue(); return; }
  fullLine=dq.shift(); typeLine(fullLine);
}
function typeLine(text){
  typing=true; dTextEl.textContent=''; let i=0;
  clearInterval(typeTimer);
  typeTimer=setInterval(()=>{
    dTextEl.textContent=text.slice(0,++i);
    if(i>=text.length){ clearInterval(typeTimer); typing=false; }
  }, 22);
}
function advanceDialogue(){
  if(typing){ clearInterval(typeTimer); typing=false; dTextEl.textContent=fullLine; return; }
  nextLine();
}
function endDialogue(){
  dialogueEl.classList.add('hidden');
  state.scene='world';
  const cb=dqCb; dqCb=null;
  if(cb) cb();
  render();
}

// ---------- Choice engine ----------
function startChoice(name, prompt, options){
  state.scene='choice';
  dialogueEl.classList.add('hidden');
  choicesEl.innerHTML='';
  const p=document.createElement('div'); p.className='dbox'; p.style.marginBottom='8px';
  p.innerHTML='<div class="dname">'+name+'</div><div class="dtext">'+prompt+'</div>';
  choicesEl.appendChild(p);
  options.forEach(o=>{
    const btn=document.createElement('button'); btn.className='btn primary'; btn.textContent=o.label;
    btn.onclick=()=>{ choicesEl.classList.add('hidden'); state.scene='world'; o.pick(); };
    choicesEl.appendChild(btn);
  });
  choicesEl.classList.remove('hidden');
}

// ---------- HUD / Quest UI ----------
function syncQuestUI(){
  const q=QUESTS[Math.min(game.step, QUESTS.length-1)];
  missionTextEl.textContent='MISSION: '+q.title;
  objTextEl.textContent=q.obj;
  hudMoney.textContent=game.money+'万'; hudDay.textContent=game.day;
  updateHint(); render();
}
function updateHint(){
  const q=QUESTS[game?game.step:0];
  if(!q||!q.target){ hintEl.classList.add('hidden'); return; }
  const b=BUILDINGS.find(x=>x.id===q.target); if(!b){ hintEl.classList.add('hidden'); return; }
  const tx=b.ent.x, ty=b.ent.y;
  const dx=tx-game.px, dy=ty-game.py, dist=Math.abs(dx)+Math.abs(dy);
  let arrow='';
  if(Math.abs(dy)>=Math.abs(dx)) arrow=dy<0?'↑':'↓'; else arrow=dx<0?'←':'→';
  if(dist===0) arrow='＝';
  hintEl.textContent=arrow+'／あと約'+dist+'マス';
  hintEl.classList.remove('hidden');
}
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),1800);
}
function renderQuestList(){
  const ul=$('#questList'); ul.innerHTML='';
  QUESTS.forEach((q,i)=>{
    const li=document.createElement('li');
    let tag,cls;
    if(i<game.step){ tag='<span class="tag ok">済</span>'; cls='done'; }
    else if(i===game.step){ tag='<span class="tag now">現在</span>'; cls=''; }
    else { tag='<span class="tag next">未</span>'; cls='done'; }
    li.className=cls; li.innerHTML=tag+q.title+'<br><span style="color:#9fb4d4;font-size:.8em">'+q.obj+'</span>';
    ul.appendChild(li);
  });
}

// ---------- Save / Load ----------
function saveGame(silent){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(game)); if(!silent) toast('セーブしました'); }
  catch(e){ if(!silent) toast('セーブ失敗'); }
  refreshContinueBtn();
}
function loadGame(){
  try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; }
}
function refreshContinueBtn(){ $('#btnContinue').disabled = !loadGame(); }

// ---------- Scene flow ----------
function showTitle(){ state.scene='title'; titleEl.classList.remove('hidden'); gameEl.classList.add('hidden'); refreshContinueBtn(); }
function startWorld(){
  state.scene='world';
  titleEl.classList.add('hidden'); gameEl.classList.remove('hidden');
  $('#createModal').classList.add('hidden');
  resizeCanvas(); syncQuestUI();
}

// ---------- Wire up ----------
$('#btnNew').onclick=()=>{ $('#createModal').classList.remove('hidden'); };
$('#btnContinue').onclick=()=>{ const s=loadGame(); if(!s){ toast('セーブデータがありません'); return; } game=Object.assign(defaultGame(),s); startWorld(); };
$('#btnToVillage').onclick=()=>{
  const name=($('#inpName').value||'').trim()||'リュウ';
  game=defaultGame(); game.name=name; game.job=$('#inpJob').value;
  saveGame(true); startWorld();
  toast('ようこそ、ユリイカ村へ!');
};
$('#btnTalk').onclick=interact;
$('#btnQuest').onclick=()=>{ if(!game)return; renderQuestList(); $('#questModal').classList.remove('hidden'); };
$('#btnQuestClose').onclick=()=>$('#questModal').classList.add('hidden');
$('#btnSave').onclick=()=>{ if(game) saveGame(false); };
$('#btnBgm').onclick=toggleBgm;
$('#btnMusic').onclick=()=>{ enableAudio(); startBgm(); toast('♪ 音楽ON'); };
$('#btnSoundHelp').onclick=()=>{ alert('音が出ないとき:\n・端末のサイレント/マナーモードを解除\n・「音楽を有効にする」を一度タップ\n・ブラウザの自動再生設定を確認'); };
document.querySelectorAll('.dbtn').forEach(b=>{
  const dir=b.dataset.dir;
  const go=(e)=>{ e.preventDefault(); move(dir); };
  b.addEventListener('click', go);
});
// dialogue tap advances
dialogueEl.addEventListener('click', ()=>{ if(state.scene==='dialogue') advanceDialogue(); });

// keyboard
window.addEventListener('keydown',(e)=>{
  if(state.scene==='title'||state.scene==='choice') return;
  if(e.key==='ArrowUp'||e.key==='w'){ move('up'); e.preventDefault(); }
  else if(e.key==='ArrowDown'||e.key==='s'){ move('down'); e.preventDefault(); }
  else if(e.key==='ArrowLeft'||e.key==='a'){ move('left'); e.preventDefault(); }
  else if(e.key==='ArrowRight'||e.key==='d'){ move('right'); e.preventDefault(); }
  else if(e.key===' '||e.key==='Enter'||e.key==='z'){ interact(); e.preventDefault(); }
});

// ---------- Audio (WebAudio chiptune) ----------
function enableAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); audioOn=true; }
const MELODY=[ // "英雄の門出" ざっくり: [freq, beats]
  [523,1],[659,1],[784,2],[659,1],[784,1],[880,2],[784,1],[659,1],[587,2],[523,2],
  [587,1],[659,1],[698,2],[659,1],[587,1],[523,2],[494,1],[523,1],[587,4],
];
let melIdx=0;
function playNote(freq,dur){
  if(!audioCtx||!audioOn) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='square'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.08,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.9);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur);
}
function startBgm(){
  enableAudio(); if(!audioCtx) return;
  stopBgm(); const beat=0.28;
  const tick=()=>{ if(!audioOn){ return; } const [f,b]=MELODY[melIdx%MELODY.length]; playNote(f, b*beat); melIdx++; bgmTimer=setTimeout(tick, b*beat*1000); };
  tick();
}
function stopBgm(){ if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer=null; } }
function toggleBgm(){ if(audioOn && bgmTimer){ audioOn=false; stopBgm(); toast('♪ BGM OFF'); } else { enableAudio(); audioOn=true; startBgm(); toast('♪ BGM ON'); } }

// ---------- Boot ----------
showTitle();
window.addEventListener('load', ()=>{ refreshContinueBtn(); });
})();
</script>
